# ============================================
# MacNotes Application Configuration
# ============================================
# Default Development Profile
# ============================================

# Import secrets file (contains sensitive credentials)
spring.config.import=optional:classpath:application.properties.secrets[.properties]

# Application Name
spring.application.name=backend

# ============================================
# Database Configuration (PostgreSQL)
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/postgres}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
# spring.datasource.driver-class-name=org.postgresql.Driver   # optional

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=true

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ============================================
# Server Configuration
# ============================================
#server.port=8080

# ============================================
# AWS S3 Configuration
# ============================================
# Credentials are auto-discovered from ~/.aws/credentials by the AWS SDK.
aws.s3.bucket-name=karahi-hub
aws.s3.region=us-east-1

# ============================================
# JWT Configuration
# ============================================
# jwt.secret is defined in application.properties.secrets
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${oauth2.google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${oauth2.google.client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Provider Configuration (Google)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
